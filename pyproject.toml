[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgalign"
dynamic = ["version"]
description = "PGAlign: peak group alignment of mass spectrometry data for imaging and spatial metabolomics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Anji Deng" },
    { name = "Yuyang Zhang" },
    { name = "Qihuang Zhang", email = "qihuang.zhang@mcgill.ca" },
]
maintainers = [
    { name = "Qihuang Zhang", email = "qihuang.zhang@mcgill.ca" },
]
keywords = [
    "MALDI",
    "mass spectrometry",
    "spatial metabolomics",
    "alignment",
    "imaging",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "scanpy>=1.9.2",
    "anndata>=0.8",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
imzml = ["pyimzML>=1.5"]

[project.scripts]
pgalign = "pgalign.cli:main"

[project.urls]
Homepage = "https://stagill.github.io/PGAlign/"
Documentation = "https://stagill.github.io/PGAlign/"
Repository = "https://github.com/StaGill/PGAlign"
Issues = "https://github.com/StaGill/PGAlign/issues"

[tool.setuptools.dynamic]
version = { attr = "pgalign.__version__" }

[tool.setuptools.packages.find]
include = ["pgalign*"]
exclude = ["tests*", "CodeInPaper*"]

[tool.setuptools.package-data]
pgalign = ["data/*.npz"]
